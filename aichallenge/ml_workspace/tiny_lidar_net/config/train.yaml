data:
  # データセットのディレクトリパス
  train_dir: "/aichallenge/ml_workspace/tiny_lidar_net/dataset/train"
  val_dir: "/aichallenge/ml_workspace/tiny_lidar_net/dataset/val"

  # LiDARを何フレーム分チャネル方向に重ねて入力するか。1 で従来の単フレーム。
  # 20Hz なので 4 フレーム = 過去 150ms 分。他車の接近速度が見えるようになる。
  n_frames: 4

  # 出力の縦方向成分を何にするか。
  #   accel : 加速度をそのまま回帰（最大加速と急制動の二値に張り付き収束しにくい）
  #   speed : 目標速度を max_speed で正規化して回帰。加速度への変換は推論ノード側の
  #           比例制御が行う。コーナー手前で速度がなめらかに落ちるので学習しやすい。
  target_mode: speed
  max_speed: 8.34   # m/s (= 30 km/h)。MPC の v_max と揃える。

model:
  # "TinyLidarNet" または "TinyLidarNetSmall"
  name: "TinyLidarNet"
  # LiDARのスキャン点数
  input_dim: 750
  # 出力次元（[accel, steer]）
  output_dim: 2

train:
  batch_size: 64
  num_workers: 4
  epochs: 100
  lr: 0.001
  
  early_stop_patience: 15

  # 事前学習済みモデルのパス（指定しない場合は null）
  pretrained_path: null

  # 保存先設定
  save_dir: "/aichallenge/ml_workspace/tiny_lidar_net/checkpoints"
  log_dir: "/aichallenge/ml_workspace/tiny_lidar_net/logs"

  # 損失関数の重み設定
  loss:
    steer_weight: 1.0
    accel_weight: 1.0
